name: Refresh profile visuals

on:
  workflow_dispatch:
  schedule:
    # Daily at 02:17 UTC (10:17 China Standard Time).
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-visuals.yml"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: xixi-box
          outputs: |
            dist/github-snake-light.svg?palette=github-light&color_snake=#0d9488
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5eead4

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=xixi-box&show_icons=true&hide_border=true&hide_rank=true&bg_color=0D1726&title_color=5EEAD4&text_color=CBD5E1&icon_color=38BDF8
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=xixi-box&layout=compact&langs_count=6&hide_border=true&bg_color=0D1726&title_color=5EEAD4&text_color=CBD5E1
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate merged upstream PR card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-merged-pr-card.mjs

      - name: Publish generated visuals to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
